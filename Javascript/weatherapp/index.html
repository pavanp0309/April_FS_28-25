<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
     <div class="card shadow border border-danger rounded">
        <div class="search-functionality d-flex">
            <input type="text" class="form-control search-city" id="search-city">
            <button class="btn btn-success" id="search-btn" onclick="displayWeather()">search</button>
        </div>

       <div class="card-body weather-info">
        <img src="./assets/cloudy.png" alt="" class="weather-img" width="100px" height="100px">
        <h3 class="temp">28 <span>&deg;</span>c</h3>
        <p class="wind_speed"> windspeed : <span>11 km/h</span></p>
        <p class="Humidity"> Humidity : <span>74%</span></p>
        <p class="location"> location : <span>Hyderabad</span></p>

       </div>

     </div>
    </div>
    
    <!-- javascript -->
    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
