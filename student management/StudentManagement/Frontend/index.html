<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container border border-danger mt-5 py-5 bg-info ">
        <form action="" id="studentform" class="my-3">
              <input type="text" class="form-control" disabled>
                <legend class="text-center fs-2">Student Management System</legend>
                <label for="student-name" class="text-dark my-3 fs-4">Name</label><br>
                <!-- fullname -->
                <input type="text" name="student-name" id="student-name" class="form-control sname" placeholder="Enter the student name">
                <label for="student-email" class="text-dark my-3 fs-4">Email</label><br>
                <!-- email -->
                <input type="email" name="student-email" id="student-email" class="form-control semail" placeholder="Enter the student email">
                <label for="student-phone" class="text-dark my-3 fs-4">Mobile Number</label><br>
                <!-- mobile -->
                <input type="tel" name="student-phone" id="student-phone" class="form-control smobile" placeholder="Enter the student mobile number">
                <label for="student-age" class="text-dark my-3 fs-4">Age</label><br>
                <!-- age -->
                <input type="number" name="student-age" id="student-age" class="form-control sage" placeholder="Enter the student age">
                <button type="submit" class="btn btn-warning mt-4 px-4 py-2 fs-5 create-btn" onclick="">create</button>
           
        </form>
         
        <!-- to display the Data -->
         <table class="table table-bodered ">
          <thead class="table-dark">
            <tr>
              <th>Id</th>
              <th>NAME</th>
              <th>AGE</th>
              <th>EMAIL</th>
              <th>MOBILE</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studenttable">
           
          </tbody>
         </table>
         <!-- toast -->
   <div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body toast-msg"></div>
  </div>
</div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
